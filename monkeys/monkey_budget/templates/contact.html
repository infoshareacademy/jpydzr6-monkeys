{% extends 'base.html' %}
{% load static %}

{% block content %}
    <!-- Contact Section -->
    <section id="contact" class="contact section">

        <!-- Section Title -->
        <div class="container section-title" data-aos="fade-up">
          <h2>Kontakt</h2>
          <p>Zapraszamy do kontaktu z zespołem Monk(e)ys</p>
        </div><!-- End Section Title -->
  
        <div class="container" data-aos="fade-up" data-aos-delay="100">
   
            <div class="row gy-4">
  
                <div class="col-lg-4">
                    <div class="info-item d-flex" data-aos="fade-up" data-aos-delay="300">
                        <i class="bi bi-geo-alt flex-shrink-0"></i>
                        <div>
                            <h3>Adres</h3>
                            <p>A108 Adam Street, New York, NY 535022</p>
                        </div>
                    </div><!-- End Info Item -->
  
                    <div class="info-item d-flex" data-aos="fade-up" data-aos-delay="400">
                        <i class="bi bi-telephone flex-shrink-0"></i>
                        <div>
                            <h3>Zadzwoń do nas</h3>
                            <p>+1 5589 55488 55</p>
                        </div>
                    </div><!-- End Info Item -->
  
                    <div class="info-item d-flex" data-aos="fade-up" data-aos-delay="500">
                        <i class="bi bi-envelope flex-shrink-0"></i>
                        <div>
                            <h3>Napisz mail</h3>
                            <p>info@example.com</p>
                        </div>
                    </div><!-- End Info Item -->
  
                </div>
  
                <div class="col-lg-8">
                    <form action="#" method="post" class="php-email-form" data-aos="fade-up" data-aos-delay="200">
                        <div class="row gy-4">
  
                            <div class="col-md-6">
                                <input type="text" name="name" class="form-control" placeholder="Twoje imię" required="">
                            </div>
  
                            <div class="col-md-6 ">
                                <input type="email" class="form-control" name="email" placeholder="Twój email" required="">
                            </div>
  
                            <div class="col-md-12">
                                <input type="text" class="form-control" name="subject" placeholder="Temat" required="">
                            </div>
  
                            <div class="col-md-12">
                                <textarea class="form-control" name="message" rows="6" placeholder="Treść wiadomości" required=""></textarea>
                            </div>
  
                            <div class="col-md-12 text-center">
                                <div class="loading">Loading</div>
                                <div class="error-message"></div>
                                <div class="sent-message">Your message has been sent. Thank you!</div>
  
                                <button type="submit">Wyślij</button>
                            </div>
  
                        </div>
                    </form>
                </div><!-- End Contact Form -->
  
            </div>
  
        </div>
  
    </section><!-- /Contact Section -->
{% endblock %}
