{% extends "account/base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3 text-center">
            <h2>{% trans "Logged out" context "logout" %}</h2>
            <p>{% trans "You have been successfully logged out." context "logout" %}</p>
            <a href="{% url 'login' %}" class="btn btn-primary">{% trans "Login again" context "logout" %}</a>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">{% trans "Back to home" context "logout" %}</a>
        </div>
    </div>
</div>
{% endblock %}
