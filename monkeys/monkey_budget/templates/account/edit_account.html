{% extends "base.html" %}
{% load static %}
{% load django_bootstrap5 %}

{% block content %}

    <div class="container">
    <h1 class="mt-3">Edycja konta</h1>

        <form method="post" class="border p-3 mb-3 bg-light rounded">
            {% csrf_token %}
            {% bootstrap_form form %}
                {{ field.label_tag }}
                {{ field }}
            <button type="submit" class="btn btn-success">Zapisz zmiany</button>
        </form>
    </div>
{% endblock content %}
